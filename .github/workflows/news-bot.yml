name: News Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.2
          RUN_MODE: once
          SEND_EXISTING_ON_FIRST_RUN: false
          INCLUDE_KOREAN_SUMMARY: true
          GOOGLE_NEWS_DAYS_BACK: 3
          SHOW_AI_ERRORS_IN_MESSAGE: true
          OPENAI_MAX_RETRIES: 5
          OPENAI_RETRY_BASE_SECONDS: 10
        run: python news_telegram_bot.py --once
