name: News Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Ensure state file exists
        run: |
          if [ ! -f state.json ]; then
            echo '{"seen_ids":[]}' > state.json
          fi

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.2
          RUN_MODE: once
          SEND_EXISTING_ON_FIRST_RUN: false
          INCLUDE_KOREAN_SUMMARY: true
          GOOGLE_NEWS_LOOKBACK: 1h
          GOOGLE_NEWS_POST_QUIET_LOOKBACK: 6h
          SHOW_AI_ERRORS_IN_MESSAGE: false
          OPENAI_MAX_RETRIES: 5
          OPENAI_RETRY_BASE_SECONDS: 10
        run: python news_telegram_bot.py --once

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi
          git commit -m "Update news bot state"
          git push
