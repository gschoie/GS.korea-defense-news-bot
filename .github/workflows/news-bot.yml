name: News Bot

on:
  workflow_dispatch:
    inputs:
      ignore_quiet_hours:
        description: "Run even during KST quiet hours (00:00-04:59)"
        type: boolean
        default: false
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Ensure state file exists
        run: |
          if [ ! -f state.json ]; then
            echo '{"seen_ids":[]}' > state.json
          fi

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # flash-lite 최신 별칭: 무료 일일 한도가 2.5-flash보다 훨씬 커서
          # 시간당 실행 × 청크 채점에도 새벽 소진('AI 채점 실패 발송 보류')이 없다
          GEMINI_MODEL: gemini-flash-lite-latest
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.2
          RUN_MODE: once
          SEND_EXISTING_ON_FIRST_RUN: false
          INCLUDE_KOREAN_SUMMARY: true
          GOOGLE_NEWS_LOOKBACK: 12h
          GOOGLE_NEWS_POST_QUIET_LOOKBACK: 24h
          IGNORE_QUIET_HOURS: ${{ inputs.ignore_quiet_hours }}
          EXCLUDE_KOREAN_MEDIA: true
          MIN_RELEVANCE: 4
          MAX_ITEMS_PER_RUN: 30
          MAX_ITEMS_TO_SCORE: 60
          SHOW_AI_ERRORS_IN_MESSAGE: false
          OPENAI_MAX_RETRIES: 5
          OPENAI_RETRY_BASE_SECONDS: 10
        run: python news_telegram_bot.py --once

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi
          git commit -m "Update news bot state"
          git push
